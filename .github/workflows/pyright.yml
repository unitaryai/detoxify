name: Pyright Type Checking

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  pyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          pip install .[dev]

      - name: Run pyright
        run: pyright
        env:
          FORCE_COLOR: "1"
